name: joint-raw-delivery
on:
  push:
    branches: [automation/jsr-joint-delivery-219158f]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify independently tested implementation payloads
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          parts = pathlib.Path('.automation/joint-219158f')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def unpack(encoded, size, sha, name):
              decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
              patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=size+1)
              assert decoder.eof and not decoder.unused_data
              assert len(patch) == size and hashlib.sha256(patch).hexdigest() == sha
              (root/name).write_bytes(patch)
              print(name, sha, len(patch))
          unpack(''.join((parts/f'{i}.b64').read_text() for i in range(4)), 125907,
                 'd266e1d3b11cf54a58f23b2be90a2431f6eebb9f1540c8078a180de4a52f7e1d', 'joint.patch')
          unpack((parts/'border.b64').read_text(), 8906,
                 'e23af54f152fde7db4613a740b66f97fb708c38b7b0cb7573fa282746223bce4', 'border.patch')
          PY
      - name: Import source only; leave workflow writes to the authorized connector
        run: |
          set -euo pipefail
          base=7af2f243d395d802831de25fc72245746fe601a1
          git checkout --detach "$base"
          git apply --index "$RUNNER_TEMP/joint.patch"
          test "$(git write-tree)" = 2def408f0d6d43c77358ac71a2a443a4268a9e6c
          git apply --index "$RUNNER_TEMP/border.patch"
          test "$(git write-tree)" = afa2bb85d39699a6687ae40fcd02ce42a1c99286
          # GITHUB_TOKEN has contents:write, not workflows permission. Do not
          # attempt workflow writes here. The user-authorized GitHub connector
          # restores the separately reviewed workflow in the feature commit.
          git restore --source="$base" --staged --worktree .github/workflows
          tree=$(git write-tree)
          head=$(git -c user.name='Latent reconstruction engineering' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'transport: verified joint RAW source, without workflow changes')
          echo "Source-only tree: $tree"
          echo "Source-only commit: $head"
          git diff --stat "$base" "$head"
          git push origin "$head:refs/heads/automation/jsr-joint-imported-219158f"
