name: high-resolution-raw

on:
  pull_request:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.comp'
      - '**CMakeLists.txt'
      - 'cmake/**'
      - 'docs/joint-raw-reconstruction.md'
      - 'docs/plans/0005-jsr-informed-joint-raw.md'
      - '.github/workflows/highres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install reproducible software GPU environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev mesa-vulkan-drivers vulkan-tools spirv-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build and validate
        env:
          LATENT_REQUIRE_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLATENT_STRICT_WARNINGS=ON
          cmake --build build --parallel 4
          set -o pipefail
          ctest --test-dir build --output-on-failure --verbose | tee build/highres-ctest.log
          ! grep -E 'Validation Error|VUID-|SYNC-HAZARD' build/highres-ctest.log
          if test -x build/latent_highres_benchmark; then
            build/latent_highres_benchmark --suite > build/highres-benchmark.jsonl
            # Same source/grid/frame membership: estimate cost and actual fit
            # usage separately from the independent irradiance quality tests.
            for group in 1 2 3 4; do
              for backend in '' '--gpu'; do
                for ablation in '' '--gaussian'; do
                  build/latent_highres_benchmark --chart --width 96 --height 80 --frames 8 \
                    --scale 2 --tile 64 --group "$group" $backend $ablation \
                    >> build/highres-joint-benchmark.jsonl
                done
              done
            done
          fi
      - name: Package offline execution dependencies
        if: always()
        run: |
          set -eu
          dir="$RUNNER_TEMP/highres-reproduction"
          mkdir -p "$dir/runtime/lib" "$dir/runtime/icd" "$dir/runtime/layers"
          git rev-parse HEAD > "$dir/source-sha.txt"
          git archive HEAD | gzip > "$dir/source.tar.gz"
          dpkg-query -W > "$dir/packages.txt"
          vulkaninfo --summary > "$dir/vulkan.txt"
          for binary in /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so /usr/lib/x86_64-linux-gnu/libVkLayer_khronos_validation.so; do
            test -f "$binary" || continue
            cp -L "$binary" "$dir/runtime/lib/"
            ldd "$binary" | awk '/=> \/.* \(/ {print $3}' | while read -r dep; do
              case "$(basename "$dep")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libstdc++.so.*|libgcc_s.so.*) continue;; esac
              cp -L "$dep" "$dir/runtime/lib/"
            done
          done
          cp /usr/share/vulkan/icd.d/lvp_icd*.json "$dir/runtime/icd/"
          cp /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json "$dir/runtime/layers/"
          python3 - "$dir/runtime" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for path in root.glob('*/*.json'):
              data = json.loads(path.read_text())
              entry = data.get('ICD', data.get('layer'))
              entry['library_path'] = '../lib/' + pathlib.Path(entry['library_path']).name
              path.write_text(json.dumps(data))
          PY
          tar -C "$dir" -czf "$dir/runtime.tar.gz" runtime
          rm -rf "$dir/runtime"
          cp build/highres-*.log "$dir/" || true
          cp build/highres-*.jsonl "$dir/" || true
          cd "$dir" && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: highres-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/highres-reproduction/
