name: checked offline Git object transfer
on:
  push:
    branches: [automation/latent-object-transfer-20260922]
permissions:
  contents: read
jobs:
  export-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the offline change and verify its exact tree
        run: |
          cp .latent-transfer.py "$RUNNER_TEMP/apply.py"
          cp .latent-docs.py "$RUNNER_TEMP/docs.py"
          git checkout --detach 3d8c5d758a4151cddc298e149d985c74af4c431d
          python "$RUNNER_TEMP/apply.py"
          python "$RUNNER_TEMP/docs.py"
          git diff --check
          git add --all
          test "$(git write-tree)" = 87546da272ff143c32238974946f8bf6c5524e09
      - name: Upload verified Git objects without moving any product branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args])
          def post(kind, data):
              request = urllib.request.Request('https://api.github.com/repos/21Z121Z1/Latent/git/' + kind,
                  data=json.dumps(data).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          entries = []
          for name in git('diff','--cached','--name-only','-z').decode().split('\0'):
              if not name: continue
              staged = git('ls-files','--stage','--',name).decode().strip()
              if not staged:
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None}); continue
              mode, expected, _ = staged.split(None,2)
              data = git('show',':' + name)
              blob = post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert blob['sha'] == expected, name
              entries.append({'path':name,'mode':mode,'type':'blob','sha':blob['sha']})
          tree = post('trees',{'base_tree':git('rev-parse','HEAD^{tree}').decode().strip(),'tree':entries})
          assert tree['sha'] == '87546da272ff143c32238974946f8bf6c5524e09', tree
          proof = {'parent':git('rev-parse','HEAD').decode().strip(),'tree':tree['sha'],
                   'transport_revision':os.environ['GITHUB_SHA'],'changed_files':len(entries)}
          print(json.dumps(proof,indent=2))
          pathlib.Path(os.environ['RUNNER_TEMP'],'object-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-object-proof-${{ github.sha }}
          path: ${{ runner.temp }}/object-proof.json
          if-no-files-found: error
          retention-days: 7
