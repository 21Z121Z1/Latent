name: joint-raw-lab
on:
  push:
    branches: [automation/jsr-joint-raw-lab]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source history
        run: |
          mkdir -p "$RUNNER_TEMP/joint-raw-inputs"
          git fetch origin e999b37a10b2c722a59636025081a0b5ba408acd 0a6a60639fdd71e4af5632b139384eb5d3bed512
          git update-ref refs/heads/export-grouped e999b37a10b2c722a59636025081a0b5ba408acd
          git update-ref refs/heads/export-geometry 0a6a60639fdd71e4af5632b139384eb5d3bed512
          git update-ref refs/heads/export-main 3bab36689c5978ffc57b83fced040168238ca322
          git bundle create "$RUNNER_TEMP/joint-raw-inputs/latent-reconcile.bundle" refs/heads/export-grouped refs/heads/export-geometry refs/heads/export-main
          sha256sum "$RUNNER_TEMP/joint-raw-inputs/latent-reconcile.bundle" > "$RUNNER_TEMP/joint-raw-inputs/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joint-raw-inputs
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/joint-raw-inputs/
