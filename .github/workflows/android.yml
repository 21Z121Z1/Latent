name: android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select JDK and fixed Android toolchain
        run: |
          mkdir -p build-host
          export JAVA_HOME="$JAVA_HOME_17_X64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$tools/sdkmanager" ]; then tools="$ANDROID_HOME/cmdline-tools/12.0/bin"; fi
          test -x "$tools/sdkmanager"
          export PATH="$JAVA_HOME/bin:$tools:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" "$tools" >> "$GITHUB_PATH"
          java -version 2>&1 | tee build-host/android-toolchain.log
          sdkmanager --version | tee -a build-host/android-toolchain.log
          # Use the licenses already accepted in the hosted runner image.
          # Do not accept a new agreement on behalf of the repository owner.
          find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' -print | tee -a build-host/android-toolchain.log
          find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' -print -quit | grep -q .
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' </dev/null
      - name: Build pinned host shader compiler
        run: |
          cmake -S . -B build-host -DLATENT_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target glslang-standalone --parallel 2
      - name: Assemble both ABIs, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 assembleDebug testDebugUnitTest lintDebug
      - name: Install fixture-only emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/latent-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
          echo no | avdmanager create avd --force --name latent-fixture --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/latent-fixture.ini"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise actual APK and JNI on emulator
        run: bash tools/ci/android-replay.sh
      - name: Archive Android outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            android/app/.cxx/**/logs/
            build-host/android-toolchain.log
            build-host/android-emulator.log
            build-host/android-logcat.log
            build-host/android-screenshot.png
            build-host/android-replay-result.png
