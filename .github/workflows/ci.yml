name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LATENT_REQUIRE_VULKAN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev libvulkan1 mesa-vulkan-drivers vulkan-tools spirv-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require software Vulkan device
        run: vulkaninfo --summary
      - name: Configure
        run: cmake -S . -B build -DLATENT_BUILD_TESTS=ON -DLATENT_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Validate SPIR-V against Vulkan 1.1
        run: |
          for shader in shaders/*.comp; do
            output="build/$(basename "$shader").spv"
            build/_deps/glslang-build/StandAlone/glslang -V --target-env vulkan1.1 -o "$output" "$shader"
            spirv-val --target-env vulkan1.1 "$output"
          done
      - name: Test
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --verbose | tee build/ctest.log
          if grep -Ei 'skip(ped|ping)?[^a-z].*vulkan|vulkan.*skip(ped|ping)?[^a-z]|Validation Error|VUID-|SYNC-HAZARD' build/ctest.log; then
            echo 'Vulkan execution is mandatory in this job' >&2
            exit 1
          fi
      - name: Record host and software Vulkan benchmark
        run: |
          ./build/latent_temporal_benchmark | tee build/temporal-benchmark.txt
          vulkaninfo --summary > build/vulkan-summary.txt

      - name: Configure (no Vulkan runtime)
        run: cmake -S . -B build-novk -DLATENT_BUILD_TESTS=ON -DLATENT_ENABLE_VULKAN_RUNTIME=OFF
      - name: Build (no Vulkan runtime)
        run: cmake --build build-novk --parallel
      - name: Test (no Vulkan runtime)
        run: ctest --test-dir build-novk --output-on-failure

      - name: Build isolated libultrahdr 2.0.2
        run: |
          git clone --depth 1 --branch v2.0.2 https://github.com/google/libultrahdr.git "$RUNNER_TEMP/libultrahdr"
          cmake -S "$RUNNER_TEMP/libultrahdr" -B "$RUNNER_TEMP/libultrahdr-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uhdr-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DUHDR_BUILD_EXAMPLES=OFF \
            -DUHDR_BUILD_TESTS=OFF \
            -DUHDR_BUILD_BENCHMARK=OFF \
            -DUHDR_BUILD_FUZZERS=OFF \
            -DUHDR_BUILD_JAVA=OFF \
            -DUHDR_ENABLE_HEIF=OFF \
            -DUHDR_ENABLE_INSTALL=ON \
            -DUHDR_WRITE_ISO=ON \
            -DUHDR_WRITE_XMP=ON
          cmake --build "$RUNNER_TEMP/libultrahdr-build" --parallel
          cmake --install "$RUNNER_TEMP/libultrahdr-build"
      - name: Configure (libultrahdr integration)
        run: |
          cmake -S . -B build-uhdr \
            -DLATENT_BUILD_TESTS=ON \
            -DLATENT_STRICT_WARNINGS=ON \
            -DLATENT_ENABLE_VULKAN_RUNTIME=OFF \
            -DLATENT_ENABLE_ULTRAHDR=ON \
            -DLATENT_ULTRAHDR_ROOT="$RUNNER_TEMP/uhdr-install"
      - name: Build (libultrahdr integration)
        run: cmake --build build-uhdr --parallel
      - name: Test (libultrahdr integration)
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/uhdr-install/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build-uhdr --output-on-failure --verbose
      - name: Prepare offline reproduction inputs
        if: always()
        run: bash tools/ci/reproduction-inputs.sh build "$RUNNER_TEMP/latent-reproduction"
      - name: Upload native evidence and reproduction inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/latent-reproduction/
            build/Testing/Temporary/LastTest.log
            build/ctest.log
            build/temporal-benchmark.txt
            build/vulkan-summary.txt
            build-novk/Testing/Temporary/LastTest.log
            build-uhdr/Testing/Temporary/LastTest.log

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Strict Clang ASan and UBSan
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-san -DLATENT_ENABLE_VULKAN_RUNTIME=OFF \
            -DLATENT_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure --verbose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitizer-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: build-san/Testing/Temporary/LastTest.log
