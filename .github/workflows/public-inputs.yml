name: public-research-inputs
on:
  push:
    branches: [work/temporal-public-inputs]
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch primary public papers and public dataset index
        run: |
          set -euo pipefail
          mkdir evidence
          curl --fail --location --retry 2 --max-time 120 'https://graphics.stanford.edu/papers/hdrp/hasinoff-hdrplus-sigasia16-preprint.pdf' -o evidence/hdrplus-2016.pdf
          curl --fail --location --retry 2 --max-time 120 'https://storage.googleapis.com/gweb-research2023-media/pubtools/5211.pdf' -o evidence/handheld-sr-2019.pdf
          curl --fail --location --retry 2 --max-time 120 'https://storage.googleapis.com/hdrplusdata?prefix=20171106_subset/&max-keys=100' -o evidence/dataset-index.xml
          (cd evidence && sha256sum *.pdf *.xml > SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -layout evidence/hdrplus-2016.pdf evidence/hdrplus-2016.txt
          pdftotext -layout evidence/handheld-sr-2019.pdf evidence/handheld-sr-2019.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-research-inputs
          retention-days: 7
          if-no-files-found: error
          path: evidence/
